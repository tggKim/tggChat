spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}   # create, update, validate, none 중 선택 가능
      show-sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}

logging:
  file:
    name: /chatApp/logs/chatApp.log
  level:
    root: info

app:
  cookie:
    secure: true

# 리버스 프록시의 전달 헤더를 반영해 OAuth2 콜백 URL을 외부 HTTPS 주소로 생성한다.
server:
  forward-headers-strategy: native